# Config inheritance
INHERIT: ../mkdocs.yml

# Project information
site_name: Git & GitHub Beginner
site_description: "Lộ trình Git và GitHub dành cho người mới bắt đầu — từ Version Control đến Collaboration và CI/CD"
docs_dir: ../knowledge/git-beginner
site_dir: ../site/git-beginner
# Repository
edit_uri: tree/main/knowledge/git-beginner
version: 1.0.0

# Configuration
theme:
  language: vi
  font:
    text: Inter
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Light mode

extra:
  status:
    new: Recently Added

# Page tree
nav:
  - Overview: index.md
  - Module 01 — Version Control Foundations:
    - Mục lục: 01-basics/index.md
    - 1.1 Version Control System là gì?: 01-basics/version-control-systems.md
    - 1.2 Git là gì & vì sao nên dùng?: 01-basics/what-is-git.md
    - 1.3 Cài đặt Git: 01-basics/install-git.md
    - 1.4 Tạo tài khoản GitHub: 01-basics/github-account.md
  - Module 02 — Basic Git Usage:
    - Mục lục: 02-basic-git-usage/index.md
    - 2.1 git init — Khởi tạo Repository: 02-basic-git-usage/git-init.md
    - 2.2 git add — Đưa thay đổi vào Staging: 02-basic-git-usage/git-add.md
    - 2.3 git commit — Ghi snapshot vào lịch sử: 02-basic-git-usage/git-commit.md
    - 2.4 git reset — Rút thay đổi khỏi Staging: 02-basic-git-usage/git-reset.md
    - 2.5 .gitignore — Loại trừ file khỏi Git: 02-basic-git-usage/gitignore.md
    - 2.6 Branch — Tạo và Merge nhánh: 02-basic-git-usage/branches-merge.md
