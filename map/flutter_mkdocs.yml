# Config inheritance
INHERIT: ../mkdocs.yml

# Project information
site_name: Plan Flutter Learning
site_description: "Flutter Learning Roadmap and Knowledge Base"
docs_dir: ../flutter/docs
site_dir: ../site/flutter
# Repository
edit_uri: tree/main/flutter/docs
version: 1.0.0

# Configuration
theme:
  language: vi
  font:
    text: Inter
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Light mode

extra:
  status:
    new: Recently Added

