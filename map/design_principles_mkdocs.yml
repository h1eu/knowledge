# Config inheritance
INHERIT: ../mkdocs.yml

# Project information
site_name: Object-Oriented Design Principles
site_description: "Các nguyên lý thiết kế hướng đối tượng — từ Core Heuristics, SOLID, GRASP đến Anti-patterns & Refactoring"
docs_dir: ../knowledge/design-principles
site_dir: ../site/design-principles
# Repository
edit_uri: tree/main/knowledge/design-principles
version: 1.0.0

# Configuration
theme:
  language: vi
  font:
    text: Inter
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/theme-light-dark
        name: Dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/theme-light-dark
        name: Light mode

extra:
  status:
    new: Recently Added

