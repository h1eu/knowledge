<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nhấn Back: bóc từng màn hình khỏi chồng</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #64748B; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #64748B; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(15,23,42,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #94A3B8; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ TRÌNH TỰ · BACK STACK</p>
  <h1>Nhấn Back: bóc từng màn hình khỏi chồng</h1>
  <p class="sub">Mở app xếp ba màn hình lên nhau, một nút Back gỡ đúng một màn hình.</p>
<svg viewBox="0 0 800 360" role="img" aria-labelledby="tb-pushback-title tb-pushback-desc" font-family="'Geist', sans-serif">
<title id="tb-pushback-title">Nhấn Back: bóc từng màn hình khỏi chồng</title>
<desc id="tb-pushback-desc">Mở app đẩy A rồi B rồi C lên stack, nhấn Back thì C finish và destroy, B hiển thị lại.</desc>
<defs>
<marker id="tb-pushback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
</marker>
<marker id="tb-pushback-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#0284C7"/>
</marker>
</defs>
<rect width="800" height="360" fill="#F8FAFC"/>
<!-- lifelines -->
<line x1="110" y1="84" x2="110" y2="312" stroke="rgba(148,163,184,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="310" y1="84" x2="310" y2="312" stroke="rgba(148,163,184,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="510" y1="84" x2="510" y2="312" stroke="rgba(148,163,184,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="710" y1="84" x2="710" y2="312" stroke="rgba(148,163,184,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<!-- activations -->
<rect x="306" y="112" width="8" height="16" fill="rgba(148,163,184,0.08)" stroke="#64748B" stroke-width="0.8"/>
<rect x="506" y="144" width="8" height="16" fill="rgba(148,163,184,0.08)" stroke="#64748B" stroke-width="0.8"/>
<rect x="706" y="176" width="8" height="96" fill="rgba(148,163,184,0.08)" stroke="#64748B" stroke-width="0.8"/>
<!-- messages -->
<path d="M 110,120 H 310" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#tb-pushback-arrow)"/>
<rect x="174" y="100" width="72" height="12" rx="2" fill="#F8FAFC"/>
<text x="210" y="109" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MỞ APP</text>
<rect x="322" y="102" width="40" height="16" rx="2" fill="#F8FAFC"/>

<text x="410" y="141" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START B</text>

<text x="666" y="251" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[A,B]</text>

<rect x="35" y="32" width="150" height="52" rx="6" fill="#F8FAFC"/>

<text x="110" y="76" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">người dùng</text>

<rect x="235" y="32" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>

<text x="310" y="76" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">root</text>
<rect x="435" y="32" width="150" height="52" rx="6" fill="#F8FAFC"/>
<rect x="435" y="32" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="510" y="60" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">ActivityB</text>
<text x="510" y="76" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">giữa</text>

<rect x="635" y="32" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2"/>

<line x1="32" y1="336" x2="768" y2="336" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="32" y="352" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="348" r="4" fill="#0284C7"/>
<text x="162" y="352" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">KẾT QUẢ · B HIỆN LẠI</text>
<line x1="400" y1="348" x2="432" y2="348" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tb-pushback-arrow)"/>
<text x="440" y="352" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">NÉT ĐỨT · TRẢ VỀ</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · SEQUENCE · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
