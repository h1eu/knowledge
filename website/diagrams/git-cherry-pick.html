<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vá đúng một commit</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #64748B; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #64748B; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(15,23,42,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #94A3B8; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ SAO CHÉP · CHERRY-PICK</p>
  <h1>Vá đúng một commit</h1>
  <p class="sub">Sao chép commit sang nhánh khác — gốc giữ nguyên, bản mới hash mới.</p>
<svg viewBox="0 0 800 352" role="img" aria-labelledby="git-cherry-pick-title git-cherry-pick-desc" font-family="'Geist', sans-serif">
<title id="git-cherry-pick-title">Vá đúng một commit</title>
<desc id="git-cherry-pick-desc">Cherry-pick sao chép commit fix timezone từ main sang release thành bản mới hash khác, commit gốc giữ nguyên.</desc>
<defs>
<marker id="git-cherry-pick-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
</marker>
</defs>
<rect width="800" height="352" fill="#F8FAFC"/>
<!-- zones -->
<rect x="32" y="24" width="340" height="280" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
<rect x="48" y="28" width="64" height="12" rx="2" fill="#F8FAFC"/>
<text x="80" y="37" fill="#94A3B8" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MAIN</text>
<rect x="428" y="24" width="340" height="280" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
<rect x="444" y="28" width="80" height="12" rx="2" fill="#F8FAFC"/>
<text x="484" y="37" fill="#94A3B8" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RELEASE</text>
<!-- arrows -->
<path d="M 202,132 V 160" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-cherry-pick-arrow)"/>
<path d="M 598,132 V 160" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-cherry-pick-arrow)"/>
<path d="M 340,192 H 460" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#git-cherry-pick-arrow)"/>
<rect x="348" y="186" width="104" height="12" rx="2" fill="#F8FAFC"/>
<text x="400" y="195" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHERRY-PICK SAO CHÉP</text>
<!-- nodes -->
<rect x="64" y="80" width="276" height="52" rx="6" fill="#F8FAFC"/>
<rect x="64" y="80" width="276" height="52" rx="6" fill="rgba(15,23,42,0.05)" stroke="#64748B" stroke-width="1"/>
<text x="202" y="111" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">···</text>
<rect x="64" y="160" width="276" height="64" rx="6" fill="#F8FAFC"/>
<rect x="64" y="160" width="276" height="64" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="202" y="194" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">f4e3d2c</text>
<text x="202" y="208" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Fix timezone · gốc giữ nguyên</text>
<rect x="460" y="80" width="276" height="52" rx="6" fill="#F8FAFC"/>
<rect x="460" y="80" width="276" height="52" rx="6" fill="rgba(15,23,42,0.05)" stroke="#64748B" stroke-width="1"/>
<text x="598" y="111" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">···</text>
<rect x="460" y="160" width="276" height="64" rx="6" fill="#F8FAFC"/>
<rect x="460" y="160" width="276" height="64" rx="6" fill="rgba(2,132,199,0.08)" stroke="#0284C7" stroke-width="1.2"/>
<text x="598" y="194" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">8a9b0c1</text>
<text x="598" y="208" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">bản sao · hash mới</text>
<!-- legend -->
<line x1="32" y1="328" x2="768" y2="328" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="32" y="344" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="340" r="4" fill="#0284C7"/>
<text x="162" y="344" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">BẢN SAO · HASH MỚI</text>
<line x1="380" y1="340" x2="412" y2="340" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#git-cherry-pick-arrow)"/>
<text x="420" y="344" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">SAO CHÉP, KHÔNG DI CHUYỂN</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · COMPARISON · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
