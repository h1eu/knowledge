<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Branch chỉ là một con trỏ</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #64748B; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #64748B; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(15,23,42,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #94A3B8; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ CON TRỎ · GIT BRANCH</p>
  <h1>Branch chỉ là một con trỏ</h1>
  <p class="sub">Tạo nhánh không copy code — chỉ là file text 41 byte trỏ tới commit.</p>
<svg viewBox="0 0 800 320" role="img" aria-labelledby="git-branch-pointer-title git-branch-pointer-desc" font-family="'Geist', sans-serif">
<title id="git-branch-pointer-title">Branch chỉ là một con trỏ</title>
<desc id="git-branch-pointer-desc">Main và feature cùng trỏ về một commit, commit trên feature thì con trỏ feature tiến tới hai commit mới.</desc>
<defs>
<marker id="git-branch-pointer-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
</marker>
</defs>
<rect width="800" height="320" fill="#F8FAFC"/>
<!-- arrows -->
<path d="M 400,96 V 120" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-branch-pointer-arrow)"/>
<path d="M 400,184 V 208" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-branch-pointer-arrow)"/>
<!-- nodes -->
<rect x="240" y="32" width="320" height="64" rx="6" fill="#F8FAFC"/>
<rect x="240" y="32" width="320" height="64" rx="6" fill="rgba(2,132,199,0.08)" stroke="#0284C7" stroke-width="1.2"/>
<text x="400" y="66" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">a1b2c3d</text>
<text x="400" y="80" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">main &amp; feature cùng trỏ về đây</text>
<rect x="240" y="120" width="320" height="64" rx="6" fill="#F8FAFC"/>
<rect x="240" y="120" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="400" y="154" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">e4f5g6h</text>
<text x="400" y="168" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">commit trên feature</text>
<rect x="240" y="208" width="320" height="64" rx="6" fill="#F8FAFC"/>
<rect x="240" y="208" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="400" y="242" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">i7j8k9l</text>
<text x="400" y="256" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">commit tiếp · main đứng yên</text>
<!-- legend -->
<line x1="32" y1="296" x2="768" y2="296" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="32" y="312" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="308" r="4" fill="#0284C7"/>
<text x="162" y="312" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">CÙNG TRỎ · MAIN &amp; FEATURE</text>
<line x1="440" y1="308" x2="472" y2="308" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-branch-pointer-arrow)"/>
<text x="480" y="312" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">CON TRỎ TIẾN THEO COMMIT</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · FLOWCHART · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
