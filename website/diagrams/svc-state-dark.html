<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vòng đời Service: bốn trạng thái</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #060913; color: #F8FAFC; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #94A3B8; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #94A3B8; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(248,250,252,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #64748B; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ TRẠNG THÁI · SERVICE</p>
  <h1>Vòng đời Service: bốn trạng thái</h1>
  <p class="sub">Start hay bind cũng qua onCreate, dừng kiểu nào cũng về onDestroy.</p>
<svg viewBox="0 0 800 392" role="img" aria-labelledby="svc-state-dark-title svc-state-dark-desc" font-family="'Geist', sans-serif">
<title id="svc-state-dark-title">Vòng đời Service: bốn trạng thái</title>
<desc id="svc-state-dark-desc">Service từ created chạy rồi dừng và hủy qua các callback onCreate onStart onDestroy.</desc>
<defs>
<marker id="svc-state-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
</marker>
</defs>
<rect width="800" height="392" fill="#060913"/>
<!-- arrows -->
<path d="M 400,40 V 64" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#svc-state-dark-arrow)"/>
<path d="M 400,120 V 160" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#svc-state-dark-arrow)"/>
<rect x="412" y="130" width="120" height="12" rx="2" fill="#060913"/>
<text x="472" y="139" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONCREATE · ONSTART</text>
<path d="M 400,216 V 256" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#svc-state-dark-arrow)"/>
<rect x="412" y="226" width="104" height="12" rx="2" fill="#060913"/>
<text x="464" y="235" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP · UNBIND</text>
<path d="M 400,312 V 336" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#svc-state-dark-arrow)"/>
<rect x="412" y="314" width="72" height="12" rx="2" fill="#060913"/>
<text x="448" y="323" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONDESTROY</text>
<!-- nodes -->
<circle cx="400" cy="32" r="6" fill="#F8FAFC"/>
<rect x="280" y="64" width="240" height="56" rx="12" fill="#060913"/>
<rect x="280" y="64" width="240" height="56" rx="12" fill="#0B132B" stroke="#F8FAFC" stroke-width="1"/>
<text x="400" y="98" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Created</text>
<rect x="280" y="160" width="240" height="56" rx="12" fill="#060913"/>
<rect x="280" y="160" width="240" height="56" rx="12" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="288" y="166" width="52" height="12" rx="2" fill="transparent" stroke="rgba(56,189,248,0.40)" stroke-width="0.8"/>
<text x="314" y="175" fill="rgba(56,189,248,0.8)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
<text x="400" y="194" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Running</text>
<rect x="280" y="256" width="240" height="56" rx="12" fill="#060913"/>
<rect x="280" y="256" width="240" height="56" rx="6" fill="#0B132B" stroke="#F8FAFC" stroke-width="1"/>
<text x="400" y="290" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Stopped</text>
<circle cx="400" cy="344" r="6" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
<!-- legend -->
<line x1="32" y1="368" x2="768" y2="368" stroke="rgba(248,250,252,0.12)" stroke-width="0.8"/>
<text x="32" y="384" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="380" r="4" fill="#38BDF8"/>
<text x="162" y="384" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">ĐANG CHẠY · RUNNING</text>
<line x1="400" y1="380" x2="432" y2="380" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#svc-state-dark-arrow)"/>
<text x="440" y="384" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">CHUYỂN TRẠNG THÁI</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · STATE · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
