<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chưa push là chưa ai thấy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #060913; color: #F8FAFC; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #94A3B8; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #94A3B8; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(248,250,252,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #64748B; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ ĐỒNG BỘ · PUSH &amp; PULL</p>
  <h1>Chưa push là chưa ai thấy</h1>
  <p class="sub">Push đưa lên, pull lôi về — commit nằm im trên máy cho tới khi push.</p>
<svg viewBox="0 0 800 272" role="img" aria-labelledby="git-push-pull-dark-title git-push-pull-dark-desc" font-family="'Geist', sans-serif">
<title id="git-push-pull-dark-title">Chưa push là chưa ai thấy</title>
<desc id="git-push-pull-dark-desc">Local và remote origin là hai bản sao độc lập, đồng bộ qua git push lên và git pull fetch về.</desc>
<defs>
<marker id="git-push-pull-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
</marker>
</defs>
<rect width="800" height="272" fill="#060913"/>
<!-- arrows -->
<path d="M 364,184 H 436" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#git-push-pull-dark-arrow)"/>
<rect x="370" y="178" width="60" height="12" rx="2" fill="#060913"/>
<text x="400" y="187" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT PUSH</text>
<path d="M 436,200 H 364" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#git-push-pull-dark-arrow)"/>
<rect x="368" y="204" width="64" height="12" rx="2" fill="#060913"/>
<text x="400" y="213" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL / FETCH</text>
<!-- nodes -->
<rect x="64" y="160" width="300" height="64" rx="6" fill="#060913"/>
<rect x="64" y="160" width="300" height="64" rx="6" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="1.2"/>
<text x="214" y="194" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Local</text>
<text x="214" y="208" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">máy bạn · hai bản sao độc lập</text>
<rect x="436" y="160" width="300" height="64" rx="6" fill="#060913"/>
<rect x="436" y="160" width="300" height="64" rx="6" fill="#0B132B" stroke="#F8FAFC" stroke-width="1"/>
<text x="586" y="194" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Remote origin</text>
<text x="586" y="208" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">GitHub · không tự đồng bộ</text>
<!-- legend -->
<line x1="32" y1="248" x2="768" y2="248" stroke="rgba(248,250,252,0.12)" stroke-width="0.8"/>
<text x="32" y="264" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="260" r="4" fill="#38BDF8"/>
<text x="162" y="264" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">NƠI LÀM VIỆC · LOCAL</text>
<line x1="400" y1="260" x2="432" y2="260" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#git-push-pull-dark-arrow)"/>
<text x="440" y="264" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">ĐỒNG BỘ HAI CHIỀU</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · COMPARISON · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
