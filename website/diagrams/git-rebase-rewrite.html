<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rebase viết lại cho thẳng hàng</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: 'Geist', sans-serif; }
  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 24px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.18em; color: #64748B; margin: 0 0 8px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #64748B; font-size: 14px; margin: 0 0 24px; }
  .colophon { border-top: 1px solid rgba(15,23,42,0.12); margin-top: 24px; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: #94A3B8; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">SƠ ĐỒ LỊCH SỬ · REBASE</p>
  <h1>Rebase viết lại cho thẳng hàng</h1>
  <p class="sub">Nhấc commit đặt lên đỉnh mới — hash đổi, bản cũ bị bỏ lại.</p>
<svg viewBox="0 0 800 384" role="img" aria-labelledby="git-rebase-rewrite-title git-rebase-rewrite-desc" font-family="'Geist', sans-serif">
<title id="git-rebase-rewrite-title">Rebase viết lại cho thẳng hàng</title>
<desc id="git-rebase-rewrite-desc">Rebase chép lại F1 F2 thành hash mới thẳng hàng sau B, commit cũ bị bỏ lại phía sau.</desc>
<defs>
<marker id="git-rebase-rewrite-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
</marker>
</defs>
<rect width="800" height="384" fill="#F8FAFC"/>
<!-- arrows -->
<path d="M 360,84 V 108" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-rebase-rewrite-arrow)"/>
<path d="M 360,164 V 200" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-rebase-rewrite-arrow)"/>
<path d="M 360,256 V 280" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#git-rebase-rewrite-arrow)"/>
<path d="M 460,136 H 540" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#git-rebase-rewrite-arrow)"/>
<rect x="472" y="130" width="56" height="12" rx="2" fill="#F8FAFC"/>
<text x="500" y="139" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BỊ BỎ LẠI</text>
<!-- nodes -->
<rect x="280" y="32" width="160" height="52" rx="20" fill="#F8FAFC"/>
<rect x="280" y="32" width="160" height="52" rx="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="360" y="63" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">A</text>
<rect x="260" y="108" width="200" height="56" rx="6" fill="#F8FAFC"/>
<rect x="260" y="108" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="360" y="142" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">B</text>
<rect x="260" y="200" width="200" height="56" rx="6" fill="#F8FAFC"/>
<rect x="260" y="200" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
<text x="360" y="234" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">F1'</text>
<rect x="260" y="280" width="200" height="56" rx="6" fill="#F8FAFC"/>
<rect x="260" y="280" width="200" height="56" rx="6" fill="rgba(2,132,199,0.08)" stroke="#0284C7" stroke-width="1.2"/>
<text x="360" y="314" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">F2'</text>
<rect x="540" y="108" width="200" height="64" rx="6" fill="#F8FAFC"/>
<rect x="540" y="108" width="200" height="64" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="640" y="138" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">F1</text>
<text x="640" y="152" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">bản cũ · không dùng</text>
<!-- legend -->
<line x1="32" y1="360" x2="768" y2="360" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="32" y="376" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<circle cx="150" cy="372" r="4" fill="#0284C7"/>
<text x="162" y="376" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">VIẾT LẠI · TUYẾN TÍNH</text>
<line x1="400" y1="372" x2="432" y2="372" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#git-rebase-rewrite-arrow)"/>
<text x="440" y="376" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">COMMIT CŨ BỊ BỎ LẠI</text>
</svg>
  <p class="colophon">DIAGRAM-DESIGN · FLOWCHART · DOC-INLINE · ENGINEER · KNOWLEDGE OS SKIN</p>
</div>
</body>
</html>
