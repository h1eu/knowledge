  <script>
    (function () {
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('kos-theme') || 'dark'; } catch (e) {}
      if (savedTheme && savedTheme !== 'dark') document.documentElement.classList.add('theme-' + savedTheme);
      var isLight = savedTheme === 'light' || savedTheme === 'editorial' || savedTheme === 'matcha';
      if (window.mermaid) {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          fontFamily: 'Plus Jakarta Sans, sans-serif',
          fontSize: 13,
          themeVariables: {
            darkMode: !isLight,
            fontFamily: 'Plus Jakarta Sans, sans-serif',
            fontSize: '13px',
            primaryColor: isLight ? '#f8fafc' : '#0f172a',
            primaryTextColor: isLight ? '#0f172a' : '#f8fafc',
            primaryBorderColor: isLight ? 'rgba(15, 23, 42, 0.16)' : 'rgba(255, 255, 255, 0.16)',
            lineColor: isLight ? '#64748b' : '#94a3b8',
            mainBkg: isLight ? '#ffffff' : '#0f172a'
          },
          flowchart: { htmlLabels: true, curve: 'bumpX', nodeSpacing: 45, rankSpacing: 55, padding: 16 }
        });
      }
    })();
  </script>
</head>

          <circle cx="12" cy="12.2" r="1.2" fill="#38BDF8"/>

      <div class="logo-text">

    <div class="header-search">

          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="searchInput" placeholder="Tìm bài LeetCode (vd: Two Sum, 1, Two Pointers...)" autocomplete="off" spellcheck="false" />
    </div>

    <button id="btn-toggle-original" class="btn-toggle-original" style="display:none;" onclick="toggleOriginalContent()">🌐 Xem bản gốc (English)</button>

    <div id="header-reading-tools" class="header-reading-tools" style="display:none;">
      <button class="reading-tool-btn" id="btn-zen-mode" onclick="toggleZenMode()" title="Chế độ tập trung">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="12" r="3"/><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/></svg>
        <span>Zen Mode</span>

      <button class="reading-tool-btn" id="btn-font-scale" onclick="cycleFontSize()" title="Thay đổi cỡ chữ">

      </button>
      <button class="reading-tool-btn" id="btn-share-topic" onclick="copyCurrentTopicLink()" title="Sao chép liên kết">

      <button class="reading-tool-btn" id="btn-scroll-top" onclick="scrollToTopicTop()" title="Lên đầu trang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>

    <nav class="header-nav">
      <a class="nav-btn" href="index.html">Trang chủ Portal</a>
      <button class="nav-btn active" onclick="showDomain('leetcode')">LeetCode 3248</button>
      <button id="btn-theme" class="btn-theme" onclick="toggleTheme()" title="Chuyển giao diện"></button>
    </nav>
  </header>

  <aside class="sidebar" id="sidebar"></aside>
  <div class="search-overlay" id="searchOverlay"></div>

    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.replace('#', '');
    const urlParams = new URLSearchParams(window.location.search);
    const topicParam = urlParams.get('topic') || hash;
    if (topicParam && findTopic(topicParam)) {
      openTopic(topicParam);
    } else {
      showDomain('leetcode');
    }
  });
</script>
