  <path d="M6 10.2L16 16V27.5L6 21.7V10.2Z" fill="url(#cubeLeft)" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M26 10.2L16 16V27.5L26 21.7V10.2Z" fill="url(#cubeRight)" fill-opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" stroke-linejoin="round"/>
